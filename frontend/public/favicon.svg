<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C89A"/>
      <stop offset="100%" stop-color="#C9A87C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4C8B8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle - dark premium -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="url(#accent)" stroke-width="0.75"/>

  <!-- Document - white with shadow -->
  <g filter="url(#shadow)">
    <path d="M10 7 L19 7 L23 11 L23 25 L10 25 Z" fill="#FAFAFA" rx="1.5"/>
    <path d="M19 7 L19 11 L23 11" fill="#E0D8D0"/>
  </g>

  <!-- Document lines - warm gold -->
  <rect x="12.5" y="14" width="8" height="1.2" rx="0.6" fill="url(#accent)" opacity="0.85"/>
  <rect x="12.5" y="17" width="6" height="1.2" rx="0.6" fill="url(#accent)" opacity="0.65"/>
  <rect x="12.5" y="20" width="7" height="1.2" rx="0.6" fill="url(#accent)" opacity="0.75"/>

  <!-- Magnifying glass - gold -->
  <circle cx="21" cy="12" r="5" fill="none" stroke="url(#accent)" stroke-width="2.2" opacity="0.95"/>
  <circle cx="21" cy="12" r="3.2" fill="url(#glass)" opacity="0.25"/>
  <line x1="24.5" y1="15.5" x2="27" y2="18" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>

  <!-- AI sparkle on document -->
  <circle cx="16" cy="10" r="1.1" fill="url(#accent)" opacity="0.9"/>
</svg>